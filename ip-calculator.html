<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" type="image/x-icon" href="favicon.png" />
  <style>
    .result {
      margin-top: 20px;
      font-family: monospace;
    }

    .result p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <!-- Header sẽ được chèn vào -->
  <div id="header"></div>
  <div class="container mt-5">
    <h1 class="text-center">IP Address Calculator</h1>
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <form id="ipForm">
          <div class="mb-3">
            <label for="ipAddress" class="form-label">IP Address</label>
            <input type="text" class="form-control" id="ipAddress" placeholder="Enter IP Address (e.g., 192.168.1.1)"
              required>
          </div>
          <div class="mb-3">
            <label for="subnetMask" class="form-label">Subnet Mask (CIDR or IP)</label>
            <input type="text" class="form-control" id="subnetMask"
              placeholder="Enter Subnet Mask (e.g., /28 or 255.255.255.240)" required>
          </div>
          <button type="submit" class="btn btn-primary">Calculate</button>
        </form>

        <div class="result" id="result">
          <!-- Results will be shown here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Tải file load-header.js để tự động chèn header -->
  <script src="load-header.js"></script>

  <script>
    document.getElementById('ipForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const ipAddress = document.getElementById('ipAddress').value;
      const subnetMaskInput = document.getElementById('subnetMask').value;

      if (!validateIP(ipAddress)) {
        alert("Please enter a valid IP address.");
        return;
      }

      let subnetMask;
      if (validateCIDR(subnetMaskInput)) {
        // Nếu subnet mask là dạng CIDR, chuyển đổi nó sang dạng IP.
        subnetMask = cidrToSubnetMask(parseInt(subnetMaskInput.slice(1)));
      } else if (validateIP(subnetMaskInput)) {
        // Nếu subnet mask là dạng IP, sử dụng trực tiếp.
        subnetMask = subnetMaskInput;
      } else {
        alert("Please enter a valid subnet mask in CIDR or IP format.");
        return;
      }

      const result = calculateNetwork(ipAddress, subnetMask);
      displayResult(result);
    });

    function validateIP(ip) {
      const regex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
      return regex.test(ip);
    }

    function validateCIDR(cidr) {
      const regex = /^\/([0-9]|[12][0-9]|3[0-2])$/;
      return regex.test(cidr);
    }

    function cidrToSubnetMask(cidr) {
      let mask = [];
      for (let i = 0; i < 4; i++) {
        let n = Math.min(cidr, 8);
        mask.push(256 - Math.pow(2, 8 - n));
        cidr -= n;
      }
      return mask.join('.');
    }

    function calculateNetwork(ipAddress, subnetMask) {
      const ipArr = ipAddress.split('.').map(Number);
      const maskArr = subnetMask.split('.').map(Number);

      const networkAddress = ipArr.map((octet, i) => octet & maskArr[i]);
      const broadcastAddress = ipArr.map((octet, i) => octet | (~maskArr[i] & 255));

      const totalHosts = Math.pow(2, 32 - maskArr.reduce((acc, octet) => acc + octet.toString(2).replace(/0/g, '').length, 0)) - 2;
      const hostMin = [...networkAddress];
      hostMin[3] += 1;
      const hostMax = [...broadcastAddress];
      hostMax[3] -= 1;

      return {
        ipAddress: ipAddress,
        subnetMask: subnetMask,
        wildcardMask: maskArr.map(octet => 255 - octet).join('.'),
        networkAddress: networkAddress.join('.'),
        broadcastAddress: broadcastAddress.join('.'),
        hostMin: hostMin.join('.'),
        hostMax: hostMax.join('.'),
        totalHosts: totalHosts
      };
    }

    function displayResult(result) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <p>Address: ${result.ipAddress}</p>
        <p>Netmask: ${result.subnetMask}</p>
        <p>Wildcard: ${result.wildcardMask}</p>
        <hr/>
        <p>Network: ${result.networkAddress}</p>
        <p>Broadcast: ${result.broadcastAddress}</p>
        <p>HostMin: ${result.hostMin}</p>
        <p>HostMax: ${result.hostMax}</p>
        <p>Hosts/Net: ${result.totalHosts}</p>
      `;
    }
  </script>

</body>

</html>
