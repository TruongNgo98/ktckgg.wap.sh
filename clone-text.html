<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone đoạn văn bản</title>

  <!-- Thêm Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body>
  <!-- Header sẽ được chèn vào -->
  <div id="header"></div>

  <div class="container my-5">
    <h1 class="text-center">Clone đoạn văn bản</h1>

    <div class="mb-3">
      <label for="textInput" class="form-label">Nhập đoạn văn bản (sử dụng {index} để chèn tham số):</label>
      <textarea id="textInput" class="form-control" rows="5"></textarea>
    </div>

    <div class="mb-3">
      <label for="numberInput" class="form-label">Nhập số lượng đoạn văn bản cần clone:</label>
      <input type="number" id="numberInput" class="form-control" min="1" value="1">
    </div>

    <div class="mb-3">
      <input type="checkbox" id="customIndexCheckbox" onchange="toggleCustomIndex()"> Sử dụng giá trị {index} tùy chỉnh
    </div>

    <!-- Phần nhập giá trị {index} tùy chỉnh với cách xuống dòng -->
    <div class="mb-3" id="customIndexInputContainer" style="display: none;">
      <label for="customIndexes" class="form-label">Nhập mỗi giá trị {index} trên một dòng riêng biệt (phân biệt từng
        giá trị bằng cách xuống hàng):</label>
      <textarea id="customIndexes" class="form-control" rows="5" placeholder="Mỗi giá trị trên một dòng"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" onclick="cloneText()">Clone</button>
      <button id="copyBtn" class="btn btn-success" onclick="copyText()" disabled>Copy kết quả</button>
    </div>

    <div class="output mt-4">
      <div class="mb-3">
        <label for="outputTextarea" class="form-label">Kết quả:</label>
        <textarea id="outputTextarea" class="form-control" rows="5" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- Tải file load-header.js để tự động chèn header -->
  <script src="load-header.js"></script>

  <script>
    function toggleCustomIndex() {
      const customIndexInputContainer = document.getElementById('customIndexInputContainer');
      customIndexInputContainer.style.display = document.getElementById('customIndexCheckbox').checked ? 'block' : 'none';
    }

    function cloneText() {
      const text = document.getElementById('textInput').value;
      const numberOfClones = parseInt(document.getElementById('numberInput').value);
      const isCustomIndex = document.getElementById('customIndexCheckbox').checked;

      let result = '';

      if (isCustomIndex) {
        // Chế độ tùy chỉnh giá trị {index}
        const customIndexes = document.getElementById('customIndexes').value.split('\n').map(index => index.trim()).filter(index => index !== '');

        if (customIndexes.length === 0) {
          alert('Vui lòng nhập ít nhất một giá trị {index} (bao gồm chữ hoặc số).');
          return;
        }

        for (const customIndex of customIndexes) {
          const clonedText = text.replace(/{index}/g, customIndex); // Thay thế {index} bằng giá trị tùy chỉnh
          result += clonedText + '\n';
        }

      } else {
        // Chế độ tuyến tính
        if (isNaN(numberOfClones) || numberOfClones <= 0) {
          alert('Vui lòng nhập một số lượng hợp lệ.');
          return;
        }

        for (let i = 1; i <= numberOfClones; i++) {
          const clonedText = text.replace(/{index}/g, i); // Thay thế {index} bằng số tuyến tính
          result += clonedText + '\n';
        }
      }

      document.getElementById('outputTextarea').value = result.trim();
      document.getElementById('copyBtn').disabled = result.trim() === '';
    }


    function copyText() {
      const outputTextarea = document.getElementById('outputTextarea');
      outputTextarea.select();
      document.execCommand('copy');
      alert('Kết quả đã được copy vào clipboard!');
    }
  </script>
</body>

</html>
